# Publie le site (index.html + logo.svg) sur https://chinw3.github.io/swish/

name: Publier le site

on:
  push:
    branches: [main]
    paths: ["index.html", "logo.svg", "swish-demo.mp4", "swish-capture.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp index.html logo.svg _site/
          if [ -f swish-demo.mp4 ]; then cp swish-demo.mp4 _site/; fi
          if [ -f swish-capture.png ]; then cp swish-capture.png _site/; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
